name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run arch
      - name: Cliente generado coincide con openapi/openapi.json
        run: npm run api:check
      - run: npm run build
        env:
          VITE_API_URL: http://api.test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
